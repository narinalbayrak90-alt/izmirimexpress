<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web` (/app/ in production). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="İzmirim Express ile kurye çağırın, gönderinizi canlı takip edin.">
  <meta name="theme-color" content="#FCBB07">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="İzmirim Express">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>İzmirim Express</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API for google_maps_flutter on web. The backend
    redirects this to Google with the API key set in the admin panel, so the
    key never has to be hardcoded here.
  -->
  <script src="/admin/api/maps/js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #FCBB07; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loading img { width: 120px; height: 120px; border-radius: 24px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.8; } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="İzmirim Express"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script>
    // Smooth mouse-wheel scrolling. Flutter jumps a whole wheel notch
    // (~100px) in one frame, which reads as stuttering on a desktop page.
    // A notch from a real mouse is caught here before Flutter sees it and
    // replayed as small eased steps over the next frames. Trackpads (which
    // already send small deltas), Ctrl + wheel and wheels over the Google
    // map are left alone.
    (function () {
      var pending = 0, frame = 0, target = null, origin = null;

      function step() {
        var delta = Math.abs(pending) < 1 ? pending : pending * 0.25;
        pending -= delta;
        target.dispatchEvent(new WheelEvent('wheel', {
          deltaY: delta, deltaMode: 0,
          clientX: origin.clientX, clientY: origin.clientY,
          screenX: origin.screenX, screenY: origin.screenY,
          bubbles: true, cancelable: true, composed: true,
        }));
        frame = pending !== 0 ? requestAnimationFrame(step) : 0;
      }

      window.addEventListener('wheel', function (event) {
        if (!event.isTrusted || event.ctrlKey || event.metaKey || event.deltaX !== 0) return;
        if (!event.wheelDeltaY || event.wheelDeltaY % 120 !== 0) return;
        if (event.deltaMode > 1) return;
        if (event.target.closest && event.target.closest('.gm-style')) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        pending += event.deltaMode === 1 ? event.deltaY * 40 : event.deltaY;
        target = event.target;
        origin = event;
        if (!frame) frame = requestAnimationFrame(step);
      }, { capture: true, passive: false });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
