<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web` (/app/ in production). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Chrome: follow the phone's font size through the page's text size
       instead of zooming the whole page (the app keeps text at its designed
       size anyway; see lib/app.dart). -->
  <meta name="text-scale" content="scale">
  <meta name="description" content="İzmirim Express ile kurye çağırın, gönderinizi canlı takip edin.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="İzmirim Express">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/logo-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/logo-favicon.png"/>

  <title>İzmirim Express</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API for google_maps_flutter on web. The backend
    redirects this to Google with the API key set in the admin panel, so the
    key never has to be hardcoded here.
  -->
  <script src="/admin/api/maps/js"></script>

  <style>
    /* Everything around the app is white — page, loading screen and the
       browser / installed-app bars (theme-color) — so no yellow stripes
       show above the app or under its bottom bar on Android. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #loading { position: fixed; inset: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; }
    #loading img { width: 120px; height: 120px; border-radius: 24px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.8; } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/logo-192.png" alt="İzmirim Express"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script>
    // Where the browser can't give the app its fast multi-threaded drawing
    // mode (iPhone Safari: it needs cross-origin isolation, which Safari
    // only allows in a form that breaks Google Maps), phones draw at no
    // more than 2.5 pixels per point. Every pixel is drawn again on each
    // frame while scrolling, and on a single thread a 3x screen stutters.
    // Everywhere else (Android Chrome, desktops) the screen's full
    // resolution is used: capping it there made the app look blurry.
    (function () {
      if (self.crossOriginIsolated || !window.matchMedia('(pointer: coarse)').matches) return;
      var desc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!desc || !desc.get || desc.configurable === false) return;
      var real = desc.get;
      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return Math.min(real.call(window), 2.5); },
        });
      } catch (e) {}
    })();
  </script>
  <script>
    // How much the browser zoomed the page on its own. Chrome on Android
    // zooms every page to follow the phone's font size, which makes the
    // whole app (buttons and cards too) bigger than a native app; the app
    // undoes it (lib/services/page_zoom.dart). screen.width stays at the
    // unzoomed width while the page's own width shrinks. Android only: on
    // a desktop or an iPhone, zoom is the user's own choice.
    window.izmirimZoom = function () {
      if (!/Android/.test(navigator.userAgent)) return 1;
      var landscape = window.innerWidth > window.innerHeight;
      var screenWidth = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      var zoom = screenWidth / window.innerWidth;
      return zoom > 1.02 && zoom < 2 ? zoom : 1;
    };
  </script>
  <script>
    // Smooth mouse-wheel scrolling. Flutter jumps a whole wheel notch
    // (~100px) in one frame, which reads as stuttering on a desktop page.
    // A notch from a real mouse is caught here before Flutter sees it and
    // replayed as small eased steps over the next frames. Trackpads (which
    // already send small deltas), Ctrl + wheel and wheels over the Google
    // map are left alone.
    (function () {
      var pending = 0, frame = 0, target = null, origin = null;

      function step() {
        var delta = Math.abs(pending) < 1 ? pending : pending * 0.25;
        pending -= delta;
        target.dispatchEvent(new WheelEvent('wheel', {
          deltaY: delta, deltaMode: 0,
          clientX: origin.clientX, clientY: origin.clientY,
          screenX: origin.screenX, screenY: origin.screenY,
          bubbles: true, cancelable: true, composed: true,
        }));
        frame = pending !== 0 ? requestAnimationFrame(step) : 0;
      }

      window.addEventListener('wheel', function (event) {
        if (!event.isTrusted || event.ctrlKey || event.metaKey || event.deltaX !== 0) return;
        if (!event.wheelDeltaY || event.wheelDeltaY % 120 !== 0) return;
        if (event.deltaMode > 1) return;
        if (event.target.closest && event.target.closest('.gm-style')) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        pending += event.deltaMode === 1 ? event.deltaY * 40 : event.deltaY;
        target = event.target;
        origin = event;
        if (!frame) frame = requestAnimationFrame(step);
      }, { capture: true, passive: false });
    })();
  </script>
  <script>
    // App install (PWA). Android/desktop Chrome fire `beforeinstallprompt`;
    // it's kept here so the app's "Install" button can show the browser's
    // install dialog later. iOS has no such dialog: the app shows "Share >
    // Add to Home Screen" steps instead. lib/services/pwa_install_web.dart
    // reads this through `window.izmirimPwa`.
    (function () {
      var deferred = null;
      var notify = function () { window.dispatchEvent(new Event('izmirim-pwa-change')); };

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferred = event;
        notify();
      });
      window.addEventListener('appinstalled', function () { deferred = null; notify(); });

      window.izmirimPwa = {
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        },
        isIos: function () {
          var ua = navigator.userAgent;
          // iPadOS reports itself as a Mac; touch support tells them apart.
          return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        },
        canPrompt: function () { return deferred !== null; },
        prompt: function () {
          if (!deferred) return Promise.resolve('unavailable');
          var event = deferred;
          deferred = null;
          event.prompt();
          return event.userChoice.then(function (choice) { notify(); return choice.outcome; });
        },
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Once OneSignal has registered the same worker (with its own
          // query string) leave it alone, or the two would keep replacing
          // each other's registration on every load.
          navigator.serviceWorker.getRegistration('/').then(function (existing) {
            var url = existing && existing.active && existing.active.scriptURL;
            if (url && url.indexOf('/app/sw.js') !== -1) return;
            // Whole site when the server allows it (Service-Worker-Allowed),
            // otherwise just /app/.
            return navigator.serviceWorker.register('/app/sw.js', { scope: '/' }).catch(function () {
              return navigator.serviceWorker.register('/app/sw.js');
            });
          }).catch(function () {});
        });
      }
    })();
  </script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    // Browser push through OneSignal's Web SDK (the Flutter SDK has no web
    // side). The app calls init() with the App ID from the admin panel
    // (App Setting > Push Notification > User App), tags the signed-in
    // customer with user_id like the mobile app does, and asks for
    // permission from a button tap. lib/services/web_push_web.dart reads
    // this through `window.izmirimPush`. OneSignal shares /app/sw.js with
    // the app install worker (see sw.js).
    (function () {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      var ready = null;

      function withOneSignal(fn) {
        if (!ready) return Promise.resolve(null);
        return ready.then(function (os) { return os ? fn(os) : null; });
      }

      window.izmirimPush = {
        isSupported: function () {
          return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
        },
        permission: function () {
          return 'Notification' in window ? Notification.permission : 'denied';
        },
        init: function (appId) {
          if (ready || !window.izmirimPush.isSupported()) return;
          ready = new Promise(function (resolve) {
            window.OneSignalDeferred.push(function (os) {
              return os.init({
                appId: appId,
                serviceWorkerPath: 'app/sw.js',
                serviceWorkerParam: { scope: '/' },
              }).then(function () { resolve(os); }, function (error) {
                console.warn('OneSignal init failed', error);
                resolve(null);
              });
            });
          });
        },
        requestPermission: function () {
          if (!window.izmirimPush.isSupported()) return Promise.resolve(false);
          // Push not configured in the panel yet: still ask, so OneSignal
          // subscribes this browser as soon as it starts.
          if (!ready) {
            return Notification.requestPermission().then(function (answer) { return answer === 'granted'; }, function () { return false; });
          }
          return withOneSignal(function (os) {
            return os.Notifications.requestPermission().then(function () {
              return os.Notifications.permission === true;
            });
          }).then(function (granted) { return granted === true; }, function () { return false; });
        },
        tag: function (customerId) {
          withOneSignal(function (os) { return os.User.addTag('user_id', customerId); }).catch(function () {});
        },
        untag: function () {
          withOneSignal(function (os) { return os.User.removeTag('user_id'); }).catch(function () {});
        },
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
